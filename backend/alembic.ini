# Alembic: migrações do banco do CampusLost. Rode de dentro de `backend/`:
#   alembic upgrade head
# A URL vem de DATABASE_URL (mesma variável da aplicação); `-x url=...` sobrescreve.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# A URL NÃO fica aqui: alembic/env.py a lê de DATABASE_URL / padrão da aplicação.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
